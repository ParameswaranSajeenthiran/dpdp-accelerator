# =============================================================================
# WSO2 DPDP Accelerator
#
# Everything above this banner is the stock WSO2 Identity Server 7.3.0
# deployment.toml, unchanged apart from the IS_HOSTNAME, IS_ADMIN_USERNAME and
# IS_ADMIN_PASSWORD placeholders that configure.sh substitutes.
# =============================================================================

# Enables the consent management v2 API used by the consent portal. This single
# switch also re-renders repository/conf/identity/resource-access-control-v2.xml
# with the v2 rules and registers the v2 API resources together with their
# internal_consent_mgt_* scopes, so none of those files should be edited by hand.
[consent_mgt]
enable_v2_api = true

# Lets the Console's flows view read consent purposes.
[console.flows.scopes]
read = ["internal_flow_view", "internal_governance_view", "internal_consent_mgt_purpose_view"]

# The consent portal is a single page application: the browser loads the shell
# and its assets before anyone has signed in, and the sign-in redirect comes
# back to the same context. The server's authentication valve must therefore
# not gate these paths. Webapp contexts that are not listed here default to
# secured, which would reject the shell and the redirects outright. The pattern
# has no slash before the wildcard so the bare context path matches too.
#
# Nothing is exposed by this: the portal holds no data of its own, and every
# Identity Server API it calls enforces the user's own OAuth token.
#
# Entries here are merged with the Identity Server's built-in rules rather than
# replacing them.
[[resource.access_control]]
context = "(.*)/consent-portal(.*)"
secure = "false"
http_method = "all"

# The four consent-history read routes. Admin routes require the IS-native
# consent-history scopes (seeded by identity.extensions at startup, the same
# way enable_v2_api above seeds internal_consent_mgt_* for the v2 API); self
# routes only require internal_login, since ownership is enforced in the
# endpoint's own code rather than by scope.
[[resource.access_control]]
context = "(.*)/api/dpdp/consent-mgt/v1/consents/([^/]+)/status-history"
secure = "true"
http_method = "GET"
scopes = ["internal_consent_mgt_status_history_view"]

[[resource.access_control]]
context = "(.*)/api/dpdp/consent-mgt/v1/consents/([^/]+)/history"
secure = "true"
http_method = "GET"
scopes = ["internal_consent_mgt_history_view"]

[[resource.access_control]]
context = "(.*)/api/dpdp/consent-mgt/v1/me/consents/([^/]+)/status-history"
secure = "true"
http_method = "GET"
scopes = ["internal_login"]

[[resource.access_control]]
context = "(.*)/api/dpdp/consent-mgt/v1/me/consents/([^/]+)/history"
secure = "true"
http_method = "GET"
scopes = ["internal_login"]

# Serves the portal and the consent-history API tenant-qualified, the same way
# the server treats the My Account and Console applications: the
# TenantContextRewriteValve resolves /t/<tenant>/... to the deployed webapp
# with that tenant set as the request's tenant context. The super tenant keeps
# the unqualified path, since tenanted /t/carbon.super URLs are rejected unless
# require_super_tenant_in_urls is enabled.
[tenant_context.rewrite]
custom_webapps = ["/consent-portal/", "/api/dpdp/consent-mgt/v1/"]

# Controls the DPDP Consent Portal application/role auto-provisioning that runs
# on tenant creation and update (see components/org.wso2.dpdp.accelerator.identity.extensions).
# Set auto_provisioning_enabled = false to manage the application and roles by
# hand instead - this does not disable the portal itself, only the automatic
# creation of its application and roles.
# client_id must match whatever the deployed portal's own configuration expects -
# changing it here without updating that too will break sign-in.
[dpdp_accelerator.consent_portal]
auto_provisioning_enabled = true
client_id = "DPDP_CONSENT_PORTAL"

# Controls the capture (identity.extensions) and read APIs (consent.history.endpoint)
# for consent status-audit/history. Set enabled = false to turn off both capture
# and the read APIs; snapshot_enabled = false keeps the lightweight status-audit
# trail but stops storing full pre-mutation JSON snapshots.
# data_source_name must match the id in the [datasource.WSO2DPDP_DB] block below,
# prefixed with "jdbc/".
[dpdp_accelerator.consent_history]
enabled = true
snapshot_enabled = true
data_source_name = "jdbc/WSO2DPDP_DB"

# Ships with a working h2 file database - a fresh install needs no setup. Point this
# at a different database by editing url/username/password/driver here; no code
# change needed. Named the same way the product's own [datasource.AgentIdentity]
# block is, rather than the [[datasource]] array form.
[datasource.WSO2DPDP_DB]
id = "WSO2DPDP_DB"
url = "jdbc:h2:./repository/database/WSO2DPDP_DB;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=60000"
username = "wso2carbon"
password = "wso2carbon"
driver = "org.h2.Driver"

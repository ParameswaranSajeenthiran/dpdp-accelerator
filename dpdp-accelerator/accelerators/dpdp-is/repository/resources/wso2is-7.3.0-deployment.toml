# =============================================================================
# WSO2 DPDP Accelerator
#
# Everything above this banner is the stock WSO2 Identity Server 7.3.0
# deployment.toml, unchanged apart from the IS_HOSTNAME, IS_ADMIN_USERNAME and
# IS_ADMIN_PASSWORD placeholders that configure.sh substitutes.
# =============================================================================

# Enables the consent management v2 API used by the consent portal. This single
# switch also re-renders repository/conf/identity/resource-access-control-v2.xml
# with the v2 rules and registers the v2 API resources together with their
# internal_consent_mgt_* scopes, so none of those files should be edited by hand.
[consent_mgt]
enable_v2_api = true

# Lets the Console's flows view read consent purposes.
[console.flows.scopes]
read = ["internal_flow_view", "internal_governance_view", "internal_consent_mgt_purpose_view"]

# The consent portal is a single page application: the browser loads the shell
# and its assets before anyone has signed in, and the sign-in redirect comes
# back to the same context. The server's authentication valve must therefore
# not gate these paths. Webapp contexts that are not listed here default to
# secured, which would reject the shell and the redirects outright. The pattern
# has no slash before the wildcard so the bare context path matches too.
#
# Nothing is exposed by this: the portal holds no data of its own, and every
# Identity Server API it calls enforces the user's own OAuth token.
#
# Entries here are merged with the Identity Server's built-in rules rather than
# replacing them.
[[resource.access_control]]
context = "(.*)/consent-portal(.*)"
secure = "false"
http_method = "all"

# Serves the portal tenant-qualified, the same way the server treats the My
# Account and Console applications: the TenantContextRewriteValve resolves
# /t/<tenant>/consent-portal/... to the deployed webapp with that tenant set as
# the request's tenant context. The super tenant keeps the unqualified
# /consent-portal path, since tenanted /t/carbon.super URLs are rejected unless
# require_super_tenant_in_urls is enabled.
[tenant_context.rewrite]
custom_webapps = ["/consent-portal/"]

# The complaint-mgt endpoint is a plain JAX-RS webapp, not part of Identity
# Server's own API resource framework, so Carbon's session/valve-based
# "secured" default does not know how to authenticate a request against it -
# it would demand a Carbon session or Basic auth credentials the browser never
# has. Each route below instead has Carbon's own valve enforce OAuth2 bearer
# auth plus the exact portal:complaints:* scope that route requires, per
# complaint-server-API.yaml - /me/* routes require the :self scope, the plain
# /complaints/* (officer/admin) routes require the :any scope. This is
# defense-in-depth alongside - not a replacement for - the endpoint module's
# own TokenIntrospectionFilter/ScopeAuthorizationFilter, which independently
# validates the token and re-checks the same scopes in-process (see
# ComplaintScopeRegistry). Ordered most-specific-context first, since a
# request matches the first entry whose context and http_method both match.
#
# GET .../complaints/categories and GET .../me/complaints/categories aren't
# listed separately: they fall through to the single-path-segment
# {complaintId} pattern below, which happens to require the same scope
# (read:self / read:any) either way.

# ---- /me/complaints/* (Data Principal, :self scopes) ----
[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/me/complaints/[^/]+/attachments/[^/]+"
allowed_auth_handlers = ["OAuthAuthentication"]
http_method = "GET"
secure = "true"
scopes = ["portal:complaints:read:self"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/me/complaints/[^/]+/attachments"
allowed_auth_handlers = ["OAuthAuthentication"]
http_method = "POST"
secure = "true"
scopes = ["portal:complaints:write:self"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/me/complaints/[^/]+/comments"
allowed_auth_handlers = ["OAuthAuthentication"]
http_method = "POST"
secure = "true"
scopes = ["portal:complaints:write:self"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/me/complaints/[^/]+/timeline"
allowed_auth_handlers = ["OAuthAuthentication"]
http_method = "GET"
secure = "true"
scopes = ["portal:complaints:read:self"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/me/complaints/[^/]+/status"
allowed_auth_handlers = ["OAuthAuthentication"]
http_method = "POST"
secure = "true"
scopes = ["portal:complaints:write:self"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/me/complaints/[^/]+"
allowed_auth_handlers = ["OAuthAuthentication"]
http_method = "GET"
secure = "true"
scopes = ["portal:complaints:read:self"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/me/complaints"
allowed_auth_handlers = ["OAuthAuthentication"]
http_method = "POST"
secure = "true"
scopes = ["portal:complaints:write:self"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/me/complaints"
allowed_auth_handlers = ["OAuthAuthentication"]
http_method = "GET"
secure = "true"
scopes = ["portal:complaints:read:self"]

# ---- /complaints/* (Complaint Officer/admin, :any scopes) ----
[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints/[^/]+/attachments/[^/]+"
allowed_auth_handlers = ["OAuthAuthentication"]
http_method = "GET"
secure = "true"
scopes = ["portal:complaints:read:any"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints/[^/]+/attachments"
allowed_auth_handlers = ["OAuthAuthentication"]
http_method = "POST"
secure = "true"
scopes = ["portal:complaints:write:any"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints/[^/]+/comments"
allowed_auth_handlers = ["OAuthAuthentication"]
http_method = "POST"
secure = "true"
scopes = ["portal:complaints:write:any"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints/[^/]+/timeline"
allowed_auth_handlers = ["OAuthAuthentication"]
http_method = "GET"
secure = "true"
scopes = ["portal:complaints:read:any"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints/[^/]+/status"
allowed_auth_handlers = ["OAuthAuthentication"]
http_method = "POST"
secure = "true"
scopes = ["portal:complaints:write:any"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints/[^/]+"
allowed_auth_handlers = ["OAuthAuthentication"]
http_method = "GET"
secure = "true"
scopes = ["portal:complaints:read:any"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints"
allowed_auth_handlers = ["OAuthAuthentication"]
http_method = "POST"
secure = "true"
scopes = ["portal:complaints:write:any"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints"
allowed_auth_handlers = ["OAuthAuthentication"]
http_method = "GET"
secure = "true"
scopes = ["portal:complaints:read:any"]

# Fallback for anything under this webapp not matched by a rule above (there
# shouldn't be any) - unsecured at the Carbon level so it doesn't 401 on a
# Carbon session/Basic-auth challenge the browser never has; the endpoint
# module's own filters still gate it in-process either way.
[[resource.access_control]]
context = "(.*)/api/dpdp/complaints(.*)"
secure = "false"
http_method = "all"

# Credentials the complaint-mgt endpoint's TokenIntrospectionFilter uses to call
# this Identity Server's own OAuth2 introspection endpoint (RFC 7662) to
# validate a caller's bearer token and resolve its subject/scopes. Defaults to
# the super admin, consistent with this accelerator's local-dev posture
# elsewhere (see IS_ADMIN_USERNAME/IS_ADMIN_PASSWORD in configure.properties).
[complaint_mgt.oauth2_introspection]
endpoint = "https://IS_HOSTNAME:9443/oauth2/introspect"
username = "IS_ADMIN_USERNAME"
password = "IS_ADMIN_PASSWORD"
# The only OAuth2 application whose tokens this endpoint accepts - must match the
# client_id auto-provisioned per tenant (see [dpdp_accelerator.consent_portal] below).
# A token introspecting as active but minted for any other application is rejected.
expected_client_id = "DPDP_CONSENT_PORTAL"
# Bounds how long TokenIntrospectionFilter waits on this IS's own /oauth2/introspect endpoint
# per request - without it, a hung/unreachable IS blocks this webapp's servlet worker threads
# indefinitely, since every request here goes through introspection.
timeout_millis = "5000"

# Controls the DPDP Consent Portal application/role auto-provisioning that runs
# on tenant creation and update (see components/org.wso2.dpdp.accelerator.identity.extensions).
# Set auto_provisioning_enabled = false to manage the application and roles by
# hand instead - this does not disable the portal itself, only the automatic
# creation of its application and roles.
# client_id must match whatever the deployed portal's own configuration expects -
# changing it here without updating that too will break sign-in.
[dpdp_accelerator.consent_portal]
auto_provisioning_enabled = true
client_id = "DPDP_CONSENT_PORTAL"

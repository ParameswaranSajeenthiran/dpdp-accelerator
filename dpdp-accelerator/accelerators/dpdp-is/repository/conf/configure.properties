#
# Deployment settings consumed by bin/configure.sh.

# Hostname and port clients use to reach the Identity Server.
IS_HOSTNAME=localhost
IS_PORT=9443

# Identity Server administrator. Substituted into the shipped deployment.toml
# template only. It is never stored in the portal's runtime configuration.
IS_ADMIN_USERNAME=admin@wso2.com
IS_ADMIN_PASSWORD=wso2123

# The deployment.toml configure.sh installs. It is a complete file that REPLACES
# the one in the product, not a fragment merged into it. To support a different
# Identity Server version, add a template beside this one and point this at it.
PRODUCT_CONF_PATH=repository/resources/wso2is-7.3.0-deployment.toml

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------

# Database type for both the Identity Server's own databases (WSO2IDENTITY_DB,
# WSO2SHARED_DB, WSO2AGENTIDENTITY_DB) and the DPDP database (WSO2DPDP_DB) -
# kept as one setting since they must be kept in sync.
# h2 and mysql are configured end to end by configure.sh. For any other type
# (postgresql, mssql, oracle, db2) set the four *_DB_URL settings and DB_DRIVER
# below explicitly - configure.sh has no URL shape for them and will stop
# rather than leave a placeholder in deployment.toml.
DB_TYPE=h2

# Database names. With h2 these are the file names under repository/database/;
# with any other type they are the schema/database names on the server. Leave
# them alone unless your DBA needs different names.
IDENTITY_DB_NAME=WSO2IDENTITY_DB
SHARED_DB_NAME=WSO2SHARED_DB
AGENT_IDENTITY_DB_NAME=WSO2AGENTIDENTITY_DB
DPDP_DB_NAME=WSO2DPDP_DB

# Credentials the server uses for every one of the four databases above. The
# h2 defaults are the values the bundled databases already carry, so leave them
# as they are for DB_TYPE=h2.
DB_USERNAME=wso2carbon
DB_PASSWORD=wso2carbon

# --------------------------------------------------------------- mysql only
# Ignored unless DB_TYPE=mysql.

# Where the MySQL server is reachable from the Identity Server host.
DB_HOST=localhost
DB_PORT=3306

# Query string appended to every generated MySQL JDBC URL, without the leading
# "?". useSSL=false suits a local/dev server; drop it (and configure trust
# material) against a server that requires TLS. allowPublicKeyRetrieval is
# needed by MySQL 8's default caching_sha2_password authentication over a
# non-TLS connection. Keep the quotes - this file is sourced by bin/configure.sh
# and an unquoted `&` would be read as a shell background operator. Write the
# separators as plain `&`: configure.sh escapes them to `&amp;` on the way into
# deployment.toml, which the Identity Server copies verbatim into the XML of
# master-datasources.xml.
DB_URL_PARAMS="useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

# Account configure.sh connects as to create the databases and apply schemas.
# It needs CREATE DATABASE and DDL rights, which DB_USERNAME usually does not
# have. Leave both empty to reuse DB_USERNAME/DB_PASSWORD.
DB_ADMIN_USERNAME=
DB_ADMIN_PASSWORD=

# Set false when the databases already exist (managed by a DBA, or a second
# run of this script). true issues CREATE DATABASE IF NOT EXISTS for each of
# the four database names above and, when DB_ADMIN_USERNAME differs from
# DB_USERNAME, creates the DB_USERNAME account if it is absent and grants it
# access to them. An account that already exists keeps its current password.
CREATE_DATABASES=true

# Creates the Identity Server's OWN schema (shared, identity, agent identity
# and consent management) from the product's dbscripts. Only meaningful for a
# non-h2 DB_TYPE: with h2 the product already ships populated database files.
# Set false if the identity database is provisioned elsewhere.
APPLY_IS_PRODUCT_SCHEMA=true

# ---------------------------------------------------------------- any DB type

# JDBC driver jar copied into <IS_HOME>/repository/components/lib. Required for
# every non-h2 DB_TYPE - the product bundles only the H2 driver. Point this at
# a downloaded mysql-connector-j-<version>.jar, or leave it empty if you have
# already placed the jar there yourself.
JDBC_DRIVER_JAR=

# Overrides for the generated JDBC URLs and driver class. Leave empty for h2 or
# mysql, where configure.sh derives them from the settings above. REQUIRED for
# any other DB_TYPE.
IDENTITY_DB_URL=
SHARED_DB_URL=
AGENT_IDENTITY_DB_URL=
DPDP_DB_URL=
DB_DRIVER=

# ---------------------------------------------------------------------------
# Schema migrations
# ---------------------------------------------------------------------------

# Adds IS's own consent-mgt v2 tables to the identity database. The product's
# migration script is not idempotent (plain ALTER TABLE ... ADD COLUMN), so set
# this to false once it has been applied, or if the database is managed
# elsewhere.
APPLY_IS_CONSENT_MGT_V2_MIGRATION=true

# Set false to skip the DPDP schema creation.
APPLY_DPDP_DB_MIGRATION=true

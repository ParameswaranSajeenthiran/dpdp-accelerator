# pr-e2e.yml runs only the `multi-tenant` project, so `super-tenant`'s own coverage
# (unqualified-root routing via basePath.ts, the tenant-provisioning-skip path) would otherwise
# go untested between the Saturday weekly runs. This exercises every project nightly instead.
name: '[Nightly] Test every E2E project'

on:
  schedule:
    # Off-hours in IST and PST, distinct from the Saturday weekly slot so it does not compete
    # with those jobs for runners.
    - cron: '15 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-e2e
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # No `ref`: a scheduled run checks out the default branch, which is what we want tested.
    # No `projects`: e2e.yml's own default is every project.
    uses: ./.github/workflows/e2e.yml
    with:
      is_source: s3
    secrets: inherit

# Build + end-to-end checks for the DPDP accelerator.
#
# Blocking on main, advisory on dev: both branches run these jobs, but only main
# marks them as required status checks (Settings -> Rules -> Rulesets), so a dev PR
# still shows a red X without blocking Merge.
#
# Needs no secrets on its default path. The IS pack is a public release asset, the
# accelerator's configure.properties already defaults to localhost/admin/admin/h2,
# and the test accounts are created per run with a generated password. That is what
# keeps the plain `pull_request` trigger safe for fork PRs, where the token is
# read-only and no secrets are exposed.
name: PR checks

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      apply_updates:
        description: Apply WSO2 U2 updates to the IS pack before testing (needs subscription credentials)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IS_VERSION: 7.3.0
  ACCELERATOR_VERSION: 1.0.0-SNAPSHOT
  # TEMPORARY DEFAULT - flip to 'release' once WSO2_SUBSCRIPTION_* secrets exist.
  #
  # The vanilla 7.3.0 GA release does not carry the consent-mgt v2 API resources this
  # accelerator depends on. Confirmed by deploying it fresh in CI, then reproducing
  # the identical failure in a controlled local test against the exact byte-verified
  # release asset, then disproving the obvious fix: manually backporting the one
  # known consent DB migration script from an already-updated pack did not resolve
  # it either. The actual fix ships only via a WSO2 update (see "Apply WSO2 U2
  # updates" below), and this repo has no subscription credentials yet.
  #
  # Building from product-is's own master branch carries the feature natively, and
  # is safe to do today: master's stock deployment.toml is byte-identical to this
  # repo's wso2is-7.3.0-deployment.toml template (diffed directly, 2026-08-24) apart
  # from the three placeholders configure.sh already substitutes, so no new template
  # is needed. This can drift as master evolves - if a future e2e run fails at
  # "Apply the accelerator" specifically, re-diff the two files first.
  IS_SOURCE: master  # 'release' | 'master'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # JDK 21 serves both jobs: it satisfies the IS 7.3.0 runtime requirement and
      # builds this repo fine (maven.compiler.source is 11).
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # 20.19+/22.12+ is the repo's real floor; the test-suite README's "Node 18+"
      # is stale (see docs/known-doc-issues.md).
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # From the REPOSITORY ROOT. Building from dpdp-accelerator/ silently skips the
      # accelerator zip, because the root pom aggregates the accelerators subtree
      # separately. This also runs the frontend npm build, jacoco's 80% gate, and the
      # security/i18n/shell verify steps chained into `npm run build`.
      - name: Build
        run: mvn -B clean install
        env:
          MAVEN_OPTS: -Xmx4g

      - uses: actions/upload-artifact@v4
        with:
          name: accelerator-zip
          path: dpdp-accelerator/accelerators/dpdp-is/target/wso2-dpdp-is-accelerator-*.zip
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E integration tests
    runs-on: ubuntu-latest
    needs: build
    # Headroom for an unmeasured product-is master build (large multi-module
    # reactor, even with tests/checks skipped) plus up to 4 provisioning restarts.
    timeout-minutes: 110
    env:
      IS_BASE_URL: https://localhost:9443
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: accelerator-zip
          path: dist

      # --- Obtaining the IS pack: two mutually exclusive paths ------------------

      # A 420 MB asset. Keyed on version alone, which is correct because a published
      # release asset is immutable - bumping IS_VERSION must be the only way it changes.
      - name: Cache IS pack
        id: is-cache
        if: env.IS_SOURCE == 'release'
        uses: actions/cache@v4
        with:
          path: ~/is-pack
          key: wso2is-${{ env.IS_VERSION }}

      - name: Download IS ${{ env.IS_VERSION }}
        if: env.IS_SOURCE == 'release' && steps.is-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/is-pack && cd ~/is-pack
          base="https://github.com/wso2/product-is/releases/download/v${IS_VERSION}"
          curl -fL --retry 3 -o wso2is.zip    "${base}/wso2is-${IS_VERSION}.zip"
          curl -fL --retry 3 -o wso2is.sha256 "${base}/wso2is-${IS_VERSION}.zip.sha256"
          # Fail loudly on a truncated download rather than later, as a mystery
          # startup error.
          echo "$(cut -d' ' -f1 wso2is.sha256)  wso2is.zip" | sha256sum -c -

      # Speeds up repeat runs of the (currently default) master build. Not correctness
      # -critical - master's dependency set just floats, so a stale hit only costs time,
      # never wrongness.
      - name: Cache Maven repo for the product-is build
        if: env.IS_SOURCE == 'master'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: product-is-master-m2-${{ github.run_id }}
          restore-keys: |
            product-is-master-m2-

      # modules/distribution depends on modules/features and modules/p2-profile-gen,
      # which -am pulls in automatically; modules/integration and modules/tests-utils
      # are not needed for the runtime pack and are skipped by omission. All the
      # slow, non-runtime-affecting checks are skipped for build speed, matching how
      # this accelerator's own build should NOT be treated (that one keeps its
      # jacoco gate) - this is upstream code we are only borrowing for the moment.
      - name: Build IS from product-is master
        if: env.IS_SOURCE == 'master'
        run: |
          git clone --depth 1 https://github.com/wso2/product-is.git /tmp/product-is
          cd /tmp/product-is
          mvn -B -ntp -pl modules/distribution -am install \
            -Dmaven.test.skip=true -Dspotbugs.skip=true -Dcheckstyle.skip=true \
            -Dpmd.skip=true -Drat.skip=true -Dlicense.skip=true \
            -Dmaven.javadoc.skip=true -Djacoco.skip=true
        env:
          MAVEN_OPTS: -Xmx4g

      - name: Stage the built distribution zip
        if: env.IS_SOURCE == 'master'
        run: |
          zip_path=$(find /tmp/product-is/modules/distribution/target -maxdepth 1 -name "wso2is-*.zip" | head -1)
          if [ -z "${zip_path}" ]; then
            echo "::error::No wso2is-*.zip under modules/distribution/target - did the module path change?"
            exit 1
          fi
          mkdir -p ~/is-pack
          cp "${zip_path}" ~/is-pack/wso2is.zip
          echo "Built $(basename "${zip_path}")"

      - name: Unpack IS
        run: unzip -q ~/is-pack/wso2is.zip -d "${GITHUB_WORKSPACE}"

      # Not hardcoded to IS_VERSION: the release path unpacks to wso2is-7.3.0/, but a
      # master build's version floats (e.g. wso2is-7.4.0-SNAPSHOT/), so the actual
      # directory is detected instead of assumed.
      - name: Resolve IS_HOME
        run: |
          dir=$(find "${GITHUB_WORKSPACE}" -maxdepth 1 -type d -name "wso2is-*")
          if [ -z "${dir}" ]; then
            echo "::error::No wso2is-* directory found after unpacking"
            exit 1
          fi
          echo "IS_HOME=${dir}" >> "$GITHUB_ENV"
          echo "Resolved IS_HOME=${dir}"

      # OFF BY DEFAULT, and only meaningful on the release path - the updater expects
      # a released product, not a from-source snapshot build. Enable per run from the
      # Actions UI, or repo-wide by setting the APPLY_WSO2_UPDATES variable to "true".
      #
      # Runs before merge.sh so an update cannot clobber our dropins. U2 updates are
      # patches - the product stays 7.3.0 and updates/product.txt still reads
      # wso2is-7.3.0 - so the accelerator's stock-7.3.0 deployment.toml template stays
      # valid. The pack ships bin/update_tool_setup.sh, which detects OS/arch and
      # downloads the updater itself, so no encrypted binary needs committing.
      - name: Apply WSO2 U2 updates
        if: ${{ env.IS_SOURCE == 'release' && (inputs.apply_updates == true || vars.APPLY_WSO2_UPDATES == 'true') }}
        env:
          WSO2_USERNAME: ${{ secrets.WSO2_SUBSCRIPTION_USERNAME }}
          WSO2_PASSWORD: ${{ secrets.WSO2_SUBSCRIPTION_U2_PASSWORD }}
        run: |
          # Secrets are never exposed to fork PRs and are not provisioned on this repo
          # yet, so degrade with a warning instead of failing the run.
          if [ -z "${WSO2_USERNAME}" ] || [ -z "${WSO2_PASSWORD}" ]; then
            echo "::warning::Updates requested but WSO2 subscription credentials are absent - testing the GA pack"
            exit 0
          fi
          cd "$IS_HOME"
          bash bin/update_tool_setup.sh
          # One retry: the updater is network-flaky, which is why FSA retries it too.
          bin/wso2update_linux -v --username "$WSO2_USERNAME" --password "$WSO2_PASSWORD" \
            || bin/wso2update_linux -v --username "$WSO2_USERNAME" --password "$WSO2_PASSWORD"

      # configure.properties already defaults to localhost / admin / admin / h2 with
      # APPLY_CONSENT_DB_MIGRATION=true. On the release path the migration is silently
      # skipped instead (the GA pack does not ship it - see the IS_SOURCE note above);
      # on the master build it is expected to be present via whatever consent-mgt
      # component version master currently pulls in. Both scripts are non-interactive,
      # and configure.sh refuses to run while the server is up, which is why this
      # happens before the start step.
      - name: Apply the accelerator
        run: |
          unzip -q dist/wso2-dpdp-is-accelerator-*.zip -d "$IS_HOME"
          cd "${IS_HOME}/wso2-dpdp-is-accelerator-${ACCELERATOR_VERSION}"
          bash bin/merge.sh     "$IS_HOME"
          bash bin/configure.sh "$IS_HOME"

      - name: Start the Identity Server
        run: |
          "${IS_HOME}/bin/wso2server.sh" start
          for i in $(seq 1 60); do
            if curl -sk -o /dev/null -f "${IS_BASE_URL}/oauth2/jwks"; then
              echo "Identity Server ready after ~$((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Identity Server did not become ready within 300s"
          tail -200 "${IS_HOME}/repository/logs/wso2carbon.log"
          exit 1

      # DPDPIdentityExtensionServiceComponent.activate() runs during OSGi bundle
      # activation and can race ahead of the consent-mgt v2 API-resource registration
      # that [consent_mgt] enable_v2_api = true triggers - and it swallows its own
      # error, so a clean startup can still leave no application and no roles, which
      # would surface as 49 confusing auth failures instead of one clear one.
      #
      # This is a genuine, measured race, not a hypothetical: on a dedicated local
      # machine the accelerator wins it on nearly every boot, but on a GitHub-hosted
      # runner it was observed to lose twice in a row (2026-08-24, run 32700270002),
      # which is why a single restart is not enough - only a full restart re-triggers
      # activate(), since onTenantCreate/onTenantUpdate never fire for the super
      # tenant. Retry with bounded restarts rather than assuming one recovery works.
      - name: Verify accelerator provisioning
        run: |
          roles_found() {
            curl -sk -u admin:admin \
              "${IS_BASE_URL}/scim2/v2/Roles?filter=displayName+eq+dpdp-consent-admin" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("totalResults", 0))'
          }
          wait_for_is() {
            for i in $(seq 1 60); do
              curl -sk -o /dev/null -f "${IS_BASE_URL}/oauth2/jwks" && return 0
              sleep 5
            done
            return 1
          }

          max_restarts=4
          attempt=0
          while [ "$(roles_found)" != "1" ]; do
            if [ "${attempt}" -ge "${max_restarts}" ]; then
              echo "::error::Accelerator did not provision dpdp-consent-admin for carbon.super after ${max_restarts} restarts"
              grep -n "Error provisioning the DPDP Consent Portal" \
                "${IS_HOME}/repository/logs/wso2carbon.log" || true
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "::warning::dpdp-consent-admin missing after startup; restart ${attempt}/${max_restarts}"
            "${IS_HOME}/bin/wso2server.sh" restart
            wait_for_is || { echo "::error::Identity Server did not come back up after restart ${attempt}"; exit 1; }
          done

          if [ "${attempt}" -gt 0 ]; then
            echo "Provisioning verified after ${attempt} restart(s)."
          else
            echo "Provisioning verified."
          fi

      - name: Provision test users
        id: users
        run: |
          # Ephemeral - thrown away with the runner - but masked so it cannot reach a log.
          password="$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9')Aa1!"
          echo "::add-mask::${password}"
          echo "TEST_PASSWORD=${password}" >> "$GITHUB_ENV"
          TEST_PASSWORD="${password}" \
            bash dpdp-integration-test-suite/scripts/provision-test-users.sh

      # run-e2e.sh hard-fails without a .env, so write one. These values override
      # .env.example's localhost defaults, which utils/env.ts always loads first.
      # Usernames come from the script's own outputs rather than being repeated here.
      - name: Configure the suite
        working-directory: dpdp-integration-test-suite
        run: |
          cat > .env <<EOF
          PORTAL_BASE_URL=${IS_BASE_URL}/consent-portal
          IS_BASE_URL=${IS_BASE_URL}
          IGNORE_HTTPS_ERRORS=true
          TEST_USER_USERNAME=${{ steps.users.outputs.user }}
          TEST_USER_PASSWORD=${TEST_PASSWORD}
          TEST_CONSENT_ADMIN_USERNAME=${{ steps.users.outputs.admin }}
          TEST_CONSENT_ADMIN_PASSWORD=${TEST_PASSWORD}
          TEST_USER_2_USERNAME=${{ steps.users.outputs.user2 }}
          TEST_USER_2_PASSWORD=${TEST_PASSWORD}
          EOF
          npm ci
          npx playwright install --with-deps chromium

      # npm ci and the browser install are already done, so run-e2e.sh skips both and
      # just execs playwright. The github reporter adds inline annotations; the config
      # itself only declares html.
      - name: Run Playwright
        working-directory: dpdp-integration-test-suite
        run: ./run-e2e.sh --reporter=github,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            dpdp-integration-test-suite/playwright-report/
            dpdp-integration-test-suite/test-results/
          retention-days: 7

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: carbon-logs
          path: ${{ env.IS_HOME }}/repository/logs/
          retention-days: 7

      - name: Stop the Identity Server
        if: always()
        run: |
          "${IS_HOME}/bin/wso2server.sh" stop || true
